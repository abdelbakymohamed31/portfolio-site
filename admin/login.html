<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #111;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(251, 191, 36, 0.1);
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #fbbf24;
            font-size: 2rem;
        }

        .logo p {
            color: #9ca3af;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #f3f4f6;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: #fbbf24;
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-login:hover {
            background: #f59e0b;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎬 الأمير</h1>
            <p>لوحة تحكم الموقع</p>
        </div>

        <div class="error-message" id="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="أدخل البريد الإلكتروني للمسؤول">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                // تسجيل الدخول باستخدام Firebase Auth
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = '/admin/dashboard';
            } catch (error) {
                console.error("Login error:", error);
                errorMsg.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
