<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الأمير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0a;
            color: #f3f4f6;
            min-height: 100vh;
        }

        .header {
            background: #111;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            color: #fbbf24;
            font-size: 1.5rem;
            font-weight: 900;
        }

        .btn-logout {
            background: #dc2626;
            color: white;
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            color: #fbbf24;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #333;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #9ca3af;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .btn-add {
            background: #fbbf24;
            color: #000;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background: #f59e0b;
        }

        .items-list {
            margin-top: 1.5rem;
        }

        .item {
            background: #0d0d0d;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .item-thumb {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #333;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            color: #9ca3af;
            font-family: inherit;
        }

        .tab.active {
            background: #fbbf24;
            color: #000;
            border-color: #fbbf24;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .success-msg {
            background: #065f46;
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .file-upload-area {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #0a0a0a;
        }

        .file-upload-area:hover,
        .file-upload-area.dragover {
            border-color: #fbbf24;
            background: #111;
        }

        .file-upload-area i {
            font-size: 2rem;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }

        .file-upload-area p {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .file-upload-area input[type="file"] {
            display: none;
        }

        .image-preview {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
        }

        .video-preview {
            max-width: 300px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
        }

        .file-name {
            color: #fbbf24;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="logo">🎬 لوحة التحكم</div>
        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </header>

    <div class="container">
        <div class="success-msg" id="success-msg">تمت العملية بنجاح!</div>

        <div class="tabs">
            <button class="tab active" data-tab="heroVideo">الفيديو التعريفي</button>
            <button class="tab" data-tab="montage">المونتاج</button>
            <button class="tab" data-tab="reels">ريلز</button>
            <button class="tab" data-tab="motionGraphics">موشن جرافيك</button>
            <button class="tab" data-tab="graphicDesign">تصميم جرافيك</button>
            <button class="tab" data-tab="thumbnails">صور مصغرة</button>
            <button class="tab" data-tab="webDesign">مواقع وتطبيقات</button>
        </div>

        <!-- Hero Video -->
        <div class="tab-content active" id="heroVideo">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-play-circle"></i> الفيديو التعريفي (الرئيسي)</h2>
                <p style="color: #9ca3af; margin-bottom: 1rem;">هذا الفيديو يظهر في أعلى الموقع. ضع رابط يوتيوب جديد لتغييره.</p>
                <div id="current-hero-video" style="margin-bottom: 1.5rem;"></div>
                <form id="form-heroVideo">
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label>رابط فيديو يوتيوب</label>
                        <input type="url" id="hero-youtube-url" placeholder="مثال: https://www.youtube.com/watch?v=..." required>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-save"></i> حفظ الفيديو التعريفي</button>
                </form>
            </div>
        </div>

        <!-- Montage -->
        <div class="tab-content" id="montage">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-clapperboard"></i> إضافة مونتاج</h2>
                <form id="form-montage">
                    <div class="form-row">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" name="title" placeholder="عنوان الفيديو" required>
                        </div>
                        <div class="form-group">
                            <label>رابط فيديو يوتيوب (عرضي - Landscape)</label>
                            <input type="url" name="videoUrl" placeholder="مثال: https://www.youtube.com/watch?v=..." required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> إضافة</button>
                </form>
                <div class="items-list" id="list-montage"></div>
            </div>
        </div>

        <!-- Motion Graphics -->
        <div class="tab-content" id="motionGraphics">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-video"></i> إضافة موشن جرافيك</h2>
                <form id="form-motionGraphics">
                    <div class="form-row">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" name="title" placeholder="عنوان الفيديو" required>
                        </div>
                        <div class="form-group">
                            <label>رابط فيديو يوتيوب</label>
                            <input type="url" name="videoUrl" placeholder="مثال: https://www.youtube.com/watch?v=..." required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> إضافة</button>
                </form>
                <div class="items-list" id="list-motionGraphics"></div>
            </div>
        </div>

        <!-- Reels -->
        <div class="tab-content" id="reels">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-film"></i> إضافة ريلز</h2>
                <form id="form-reels">
                    <div class="form-row">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" name="title" placeholder="عنوان الريلز" required>
                        </div>
                        <div class="form-group">
                            <label>رابط فيديو يوتيوب (رأسي - Shorts)</label>
                            <input type="url" name="videoUrl" placeholder="مثال: https://www.youtube.com/shorts/..." required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> إضافة</button>
                </form>
                <div class="items-list" id="list-reels"></div>
            </div>
        </div>

        <!-- Graphic Design -->
        <div class="tab-content" id="graphicDesign">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-palette"></i> إضافة تصميم جرافيك</h2>
                <form id="form-graphicDesign" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" name="title" placeholder="عنوان التصميم" required>
                        </div>
                        <div class="form-group">
                            <label>الصورة</label>
                            <div class="file-upload-area" onclick="this.querySelector('input').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p>اضغط هنا لاختيار صورة</p>
                                <input type="file" name="image" accept="image/*" required onchange="previewImage(this)">
                                <img class="image-preview" alt="preview">
                                <div class="file-name"></div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> إضافة</button>
                </form>
                <div class="items-list" id="list-graphicDesign"></div>
            </div>
        </div>

        <!-- Thumbnails -->
        <div class="tab-content" id="thumbnails">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-image"></i> إضافة صورة مصغرة</h2>
                <form id="form-thumbnails" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" name="title" placeholder="عنوان الصورة" required>
                        </div>
                        <div class="form-group">
                            <label>الصورة</label>
                            <div class="file-upload-area" onclick="this.querySelector('input').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p>اضغط هنا لاختيار صورة</p>
                                <input type="file" name="image" accept="image/*" required onchange="previewImage(this)">
                                <img class="image-preview" alt="preview">
                                <div class="file-name"></div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> إضافة</button>
                </form>
                <div class="items-list" id="list-thumbnails"></div>
            </div>
        </div>

        <!-- Web Design -->
        <div class="tab-content" id="webDesign">
            <div class="card">
                <h2 class="section-title"><i class="fa-solid fa-laptop"></i> إضافة موقع/تطبيق</h2>
                <form id="form-webDesign">
                    <div class="form-row">
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" name="title" placeholder="اسم الموقع/التطبيق" required>
                        </div>
                        <div class="form-group">
                            <label>رابط الصورة</label>
                            <input type="url" name="imageUrl" placeholder="https://example.com/image.jpg" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> إضافة</button>
                </form>
                <div class="items-list" id="list-webDesign"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <script>
        const categories = ['montage', 'reels', 'motionGraphics', 'graphicDesign', 'thumbnails', 'webDesign'];

        // Auth check - التحقق من تسجيل الدخول
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                loadContent();
            }
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // Load all content from Firestore
        async function loadContent() {
            try {
                // 1. Load Hero Video
                const heroDoc = await db.collection('settings').doc('hero').get();
                const heroVideoDiv = document.getElementById('current-hero-video');
                if (heroVideoDiv && heroDoc.exists && heroDoc.data().youtubeId) {
                    const heroVideo = heroDoc.data().youtubeId;
                    if (heroVideo.startsWith('/uploads/')) {
                        heroVideoDiv.innerHTML = `
                            <p style="color: #fbbf24; margin-bottom: 0.5rem;"><i class="fa-solid fa-check-circle"></i> الفيديو الحالي:</p>
                            <video src="${heroVideo}" style="max-width: 300px; border-radius: 12px; border: 2px solid #333;" controls muted></video>
                        `;
                    } else {
                        heroVideoDiv.innerHTML = `
                            <p style="color: #fbbf24; margin-bottom: 0.5rem;"><i class="fa-solid fa-check-circle"></i> الفيديو الحالي (يوتيوب):</p>
                            <iframe src="https://www.youtube.com/embed/${heroVideo}" style="max-width: 300px; height: 169px; border-radius: 12px; border: 2px solid #333;" frameborder="0" allowfullscreen></iframe>
                        `;
                    }
                } else if (heroVideoDiv) {
                    heroVideoDiv.innerHTML = '<p style="color: #9ca3af;"><i class="fa-solid fa-info-circle"></i> لا يوجد فيديو تعريفي حالي. يتم استخدام التنسيق الافتراضي.</p>';
                }

                // 2. Load Categories items
                const snapshot = await db.collection('portfolio_items').orderBy('createdAt', 'desc').get();
                
                const data = {
                    montage: [], reels: [], motionGraphics: [], graphicDesign: [], thumbnails: [], webDesign: []
                };

                snapshot.forEach(doc => {
                    const item = doc.data();
                    item.id = doc.id; // Store firestore document id
                    if (data[item.category]) {
                        data[item.category].push(item);
                    }
                });

                categories.forEach(category => {
                    const list = document.getElementById(`list-${category}`);
                    if (list) {
                        list.innerHTML = data[category].map(item => `
                            <div class="item">
                                <div class="item-info">
                                    ${item.imageUrl ? `<img src="${item.imageUrl}" class="item-thumb">` :
                                      item.youtubeId ? `<img src="https://img.youtube.com/vi/${item.youtubeId}/mqdefault.jpg" class="item-thumb">` : ''}
                                    <span>${item.title}</span>
                                </div>
                                <button class="btn-delete" onclick="deleteItem('${item.id}')">
                                    <i class="fa-solid fa-trash"></i> حذف
                                </button>
                            </div>
                        `).join('');
                    }
                });
            } catch (error) {
                console.error('Error loading content:', error);
            }
        }

        // Extract YouTube ID from any URL format
        function extractYouTubeId(input) {
            if (!input) return input;
            if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) {
                return input.trim();
            }
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/v\/|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
                /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/
            ];
            for (const pattern of patterns) {
                const match = input.match(pattern);
                if (match && match[1]) {
                    return match[1];
                }
            }
            return input.trim();
        }

        // Hero Video submit handler
        const heroForm = document.getElementById('form-heroVideo');
        if (heroForm) {
            heroForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const urlInput = document.getElementById('hero-youtube-url').value;
                const youtubeId = extractYouTubeId(urlInput);
                if (!youtubeId) {
                    alert('رابط يوتيوب غير صالح');
                    return;
                }
                
                const btn = heroForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';
                btn.disabled = true;

                try {
                    await db.collection('settings').doc('hero').set({ youtubeId });
                    showSuccess();
                    heroForm.reset();
                    loadContent();
                } catch (error) {
                    console.error('Error saving hero video:', error);
                    alert('حدث خطأ في حفظ الفيديو');
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        }

        // Add item handler for categories
        categories.forEach(category => {
            const form = document.getElementById(`form-${category}`);
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const title = form.querySelector('input[name="title"]').value;
                    const btn = form.querySelector('button[type="submit"]');
                    const originalBtnText = btn.innerHTML;
                    
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإضافة...';
                    btn.disabled = true;

                    try {
                        let newItem = {
                            category,
                            title,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };

                        if (['graphicDesign', 'thumbnails'].includes(category)) {
                            // Upload to Cloudinary (Free tier, no card required)
                            const fileInput = form.querySelector('input[type="file"]');
                            if (!fileInput.files || !fileInput.files[0]) {
                                alert('يرجى اختيار صورة');
                                return;
                            }
                            const file = fileInput.files[0];
                            
                            const formData = new FormData();
                            formData.append('file', file);
                            formData.append('upload_preset', 'lg5xqvab');
                            
                            const response = await fetch('https://api.cloudinary.com/v1_1/pqr9gfxr/image/upload', {
                                method: 'POST',
                                body: formData
                            });
                            
                            if (!response.ok) {
                                throw new Error('فشل رفع الصورة إلى Cloudinary');
                            }
                            
                            const data = await response.json();
                            const imageUrl = data.secure_url;
                            newItem.imageUrl = imageUrl;
                        } else if (['montage', 'reels', 'motionGraphics'].includes(category)) {
                            const videoUrl = form.querySelector('input[name="videoUrl"]').value;
                            const youtubeId = extractYouTubeId(videoUrl);
                            if (!youtubeId) {
                                alert('رابط يوتيوب غير صالح');
                                return;
                            }
                            newItem.youtubeId = youtubeId;
                        } else if (category === 'webDesign') {
                            const imageUrl = form.querySelector('input[name="imageUrl"]').value;
                            newItem.imageUrl = imageUrl;
                        }

                        // Save in Firestore
                        await db.collection('portfolio_items').add(newItem);
                        
                        showSuccess();
                        form.reset();
                        
                        // Reset inputs previews
                        const imgPreview = form.querySelector('.image-preview');
                        const vidPreview = form.querySelector('.video-preview');
                        const fileName = form.querySelector('.file-name');
                        if (imgPreview) imgPreview.style.display = 'none';
                        if (vidPreview) vidPreview.style.display = 'none';
                        if (fileName) fileName.textContent = '';
                        
                        loadContent();
                    } catch (error) {
                        console.error('Error adding item:', error);
                        alert('حدث خطأ أثناء الإضافة');
                    } finally {
                        btn.innerHTML = originalBtnText;
                        btn.disabled = false;
                    }
                });
            }
        });

        // Delete item
        async function deleteItem(id) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;

            try {
                await db.collection('portfolio_items').doc(id).delete();
                showSuccess();
                loadContent();
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('حدث خطأ في الحذف');
            }
        }

        // Show success message
        function showSuccess() {
            const msg = document.getElementById('success-msg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        // Logout
        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        // Image preview function
        function previewImage(input) {
            const area = input.closest('.file-upload-area');
            const preview = area.querySelector('.image-preview');
            const fileNameDiv = area.querySelector('.file-name');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
                fileNameDiv.textContent = input.files[0].name;
            }
        }

        // Video preview function
        function previewVideo(input) {
            const area = input.closest('.file-upload-area');
            const preview = area.querySelector('.video-preview');
            const fileNameDiv = area.querySelector('.file-name');

            if (input.files && input.files[0]) {
                const url = URL.createObjectURL(input.files[0]);
                preview.src = url;
                preview.style.display = 'block';
                const sizeMB = (input.files[0].size / (1024 * 1024)).toFixed(1);
                fileNameDiv.textContent = `${input.files[0].name} (${sizeMB} MB)`;
            }
        }
